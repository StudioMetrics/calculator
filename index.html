<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Commission vs Renter Calculator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="calculator.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Hide number input spinners for cleaner look */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; text-align: right !important; }
    /* Prevent tap highlight on mobile */
    button { -webkit-tap-highlight-color: transparent; }
    @media print {
      body { background: white !important; }
      button { display: none !important; }
      .print\:hidden { display: none !important; }
      input { border: none !important; background: transparent !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ── Salon Configuration ─────────────────────────────────────────
    // Edit these values to customize for any salon.
    const SALON_CONFIG = {
      salonName: "Studio Los Gatos",
      toolName: "Studio Metrics",
      commissionType: "tiered",  // "flat" or "tiered"
      commissionTiers: [
        { upTo: 2000, rate: 0.40 },
        { upTo: 3500, rate: 0.45 },
        { upTo: 5000, rate: 0.50 },
        { upTo: 6500, rate: 0.55 },
        { upTo: Infinity, rate: 0.60 },
      ],
      salonInvestments: {
        marketingAnnual: 33375,
        marketingDescription: "Google Ads, Yelp, Instagram, SEO",
        laundryAnnual: 6000,
        laundryDescription: "Towels, capes, linens — washed daily",
        frontDeskAnnual: 48000,
        frontDeskDescription: "Booking, check-in, phone, retail",
        newClientsPerMonth: 100,
      },
      defaultTipPercent: 18,
      defaultTab: "renter-to-commission",
    };

    // Core math & formatting loaded from calculator.js
    // (formatCurrency, formatPercent, calculateCommissionToRenter, calculateRenterToCommission)

    // Persist state in localStorage so values survive refresh / tab close
    const usePersistedState = (key, defaultValue) => {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : defaultValue;
        } catch { return defaultValue; }
      });
      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(state));
      }, [key, state]);
      return [state, setState];
    };

    // Persist salon config with Infinity handling and defaults merging
    const useConfigState = (key, defaults) => {
      const serialize = (config) => ({
        ...config,
        commissionTiers: config.commissionTiers.map(t => ({
          ...t, upTo: t.upTo === Infinity ? "Infinity" : t.upTo
        }))
      });
      const deserialize = (raw) => {
        const merged = { ...defaults, ...raw };
        merged.salonInvestments = { ...defaults.salonInvestments, ...raw.salonInvestments };
        merged.commissionTiers = (raw.commissionTiers || defaults.commissionTiers).map(t => ({
          ...t, upTo: t.upTo === "Infinity" || t.upTo === null ? Infinity : t.upTo
        }));
        return merged;
      };
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? deserialize(JSON.parse(saved)) : defaults;
        } catch { return defaults; }
      });
      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(serialize(state)));
      }, [key, state]);
      return [state, setState];
    };

    // Currency input: shows "$1,234" when blurred, raw number when editing
    const CurrencyInput = ({ value, onChange, ...props }) => {
      const [focused, setFocused] = useState(false);
      const display = focused ? (value || '') : formatCurrency(value).replace('$', '');
      return (
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-stone-400 pointer-events-none">$</span>
          <input
            type={focused ? 'number' : 'text'}
            value={display}
            onFocus={() => setFocused(true)}
            onBlur={() => setFocused(false)}
            onChange={onChange}
            className="w-full pl-8 pr-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 text-right transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
            {...props}
          />
        </div>
      );
    };

    // Shared input styling
    const inputClass = "w-full px-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 text-right transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500";
    const readOnlyClass = "w-full px-3 py-3 border border-stone-200 rounded-lg text-[16px] leading-6 bg-stone-100 text-stone-500";
    const labelClass = "text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider";
    const helpClass = "text-xs text-stone-400 mt-1";

    // Expense input: converts between storage unit and display mode
    const ExpenseInput = ({ label, value, storageUnit, displayMode, onChange }) => {
      const displayValue = storageUnit === displayMode ? value
        : storageUnit === 'weekly' ? Math.round(value * 52)
        : Math.round(value / 52);
      const altValue = storageUnit === displayMode
        ? (storageUnit === 'weekly' ? formatCurrency(value * 52) + '/yr' : formatCurrency(Math.round(value / 52)) + '/wk')
        : (displayMode === 'weekly' ? formatCurrency(value) + '/yr' : formatCurrency(value) + '/wk');

      const handleInputChange = (e) => {
        const raw = parseFloat(e.target.value) || 0;
        if (storageUnit === displayMode) onChange(raw);
        else if (storageUnit === 'weekly') onChange(raw / 52);
        else onChange(raw * 52);
      };

      return (
        <div className="flex flex-col">
          <label className={labelClass}>{label}</label>
          <CurrencyInput value={displayValue} onChange={handleInputChange} />
          <span className={helpClass}>{altValue}</span>
        </div>
      );
    };

    // Reusable Weekly/Yearly toggle buttons for section headings
    const ExpenseModeToggle = ({ mode, setMode }) => (
      <div className="flex rounded-md overflow-hidden border border-stone-300 text-[11px]">
        <button type="button" onClick={() => setMode('weekly')} className={`px-2 py-0.5 font-medium transition-colors ${mode === 'weekly' ? 'bg-amber-500 text-white' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}`}>Weekly</button>
        <button type="button" onClick={() => setMode('yearly')} className={`px-2 py-0.5 font-medium transition-colors ${mode === 'yearly' ? 'bg-amber-500 text-white' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}`}>Yearly</button>
      </div>
    );

    // Commission to Renter Calculator
    const CommissionToRenter = ({ config }) => {
      const [inputs, setInputs] = usePersistedState('c2r-inputs', {
        serviceIncome: 100000,
        tips: 18000,
        startingRate: 40,
        weeklyRent: 525,
        colorSupplies: 10125,
        marketing: 1200,
        assistantHourly: 0,
        assistantHours: 0,
        assistantDays: 0,
        asstTaxPct: 0,
        ccFeePct: 2.9,
      });

      const [showAssistant, setShowAssistant] = useState(inputs.assistantHourly > 0);
      const [expenseMode, setExpenseMode] = useState('yearly');
      const [clientRetention, setClientRetention] = useState(80);
      const [showScenarios, setShowScenarios] = useState(false);

      const handleChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
      };

      const calculations = useMemo(() => calculateCommissionToRenter({
        ...inputs,
        commissionType: config.commissionType,
        commissionTiers: config.commissionTiers,
        salonInvestments: config.salonInvestments,
      }), [inputs, config]);

      const retainedIncome = calculations.totalIncome * (clientRetention / 100);
      const renterPreTax = retainedIncome - calculations.totalCOGS;
      const renterSeTax = calculateSelfEmploymentTax(renterPreTax);
      const renterTakeHome = renterPreTax - renterSeTax.seTax;

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
          {/* Explainer Callout */}
          <div className="bg-stone-100 border border-stone-200 rounded-xl p-4 mb-8">
            <p className="text-sm text-stone-600">Already on commission? Enter your numbers to see what it would really cost to go out on your own — including the risk of losing clients.</p>
          </div>

          {/* Income Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Income</h3>
            <div className="grid grid-cols-1 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Service Income</label>
                <CurrencyInput value={inputs.serviceIncome} onChange={(e) => handleChange('serviceIncome', e.target.value)} />
                <span className={helpClass}>Total services billed</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Tips</label>
                <CurrencyInput value={inputs.tips} onChange={(e) => handleChange('tips', e.target.value)} />

              </div>
            </div>
          </div>

          {/* Costs Section */}
          <div className="mb-8">
            <div className="flex items-center justify-between mb-4 pb-2 border-b-2 border-stone-100">
              <h3 className="text-sm font-semibold text-stone-700">Estimated Renter Expenses</h3>
              <ExpenseModeToggle mode={expenseMode} setMode={setExpenseMode} />
            </div>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <ExpenseInput label="Booth Rent" value={inputs.weeklyRent} storageUnit="weekly" displayMode={expenseMode} onChange={(v) => handleChange('weeklyRent', v)} />
              <ExpenseInput label="Color &amp; Supplies" value={inputs.colorSupplies} storageUnit="yearly" displayMode={expenseMode} onChange={(v) => handleChange('colorSupplies', v)} />
              <ExpenseInput label="Marketing" value={inputs.marketing} storageUnit="yearly" displayMode={expenseMode} onChange={(v) => handleChange('marketing', v)} />
            </div>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Credit Card Fee</label>
                <div className="relative">
                  <input type="number" className={inputClass + " pr-8"} value={inputs.ccFeePct} onChange={(e) => handleChange('ccFeePct', e.target.value)} />
                  <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-stone-400 pointer-events-none">%</span>
                </div>
              </div>
            </div>
            <div className="mb-4">
              <button type="button" onClick={() => setShowAssistant(prev => !prev)} className="flex items-center gap-2 text-sm text-stone-500 hover:text-stone-700 transition-colors">
                <span className={`inline-block transition-transform ${showAssistant ? 'rotate-90' : ''}`}>&#9654;</span>
                {showAssistant ? 'Hide assistant costs' : 'Add assistant costs'}
                {inputs.assistantHourly > 0 && !showAssistant && <span className="text-xs text-stone-400">({formatCurrency(calculations.asstYearly)}/yr)</span>}
              </button>
            </div>
            {showAssistant && (
            <React.Fragment>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hourly Rate</label>
                <CurrencyInput value={inputs.assistantHourly} onChange={(e) => handleChange('assistantHourly', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hours/Day</label>
                <input type="number" className={inputClass} value={inputs.assistantHours} onChange={(e) => handleChange('assistantHours', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Days/Week</label>
                <input type="number" className={inputClass} value={inputs.assistantDays} onChange={(e) => handleChange('assistantDays', e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Tax %</label>
                <input type="number" className={inputClass} value={inputs.asstTaxPct} onChange={(e) => handleChange('asstTaxPct', e.target.value)} />
              </div>
            </div>
            </React.Fragment>
            )}
          </div>

          {/* What the Salon Provides — only shown when salon investments are configured */}
          {calculations.salonInvestmentsBreakdown.length > 0 && (
          <div className="bg-emerald-50 border border-emerald-200/60 rounded-xl p-5 md:p-6 mb-8">
            <h3 className="text-sm font-semibold text-emerald-800 mb-4">What the Salon Provides</h3>
            {calculations.salonInvestmentsBreakdown.map((item, i) => (
              <div key={i} className="flex items-center justify-between gap-2 py-1.5">
                <span className="text-sm text-stone-700">&#10003; {item.label}</span>
                <span className="text-sm font-semibold text-emerald-700">{formatCurrency(item.amount)}/yr</span>
              </div>
            ))}
            <div className="mt-3 pt-3 border-t border-emerald-200/60 flex flex-wrap justify-between items-baseline gap-x-4">
              <span className="text-sm font-semibold text-emerald-800">Total Salon Investment</span>
              <span className="text-lg font-bold text-emerald-700">{formatCurrency(calculations.salonInvestmentsValue)}/yr</span>
            </div>
            {config.salonInvestments.newClientsPerMonth > 0 && (
            <div className="bg-white/60 border border-emerald-200 rounded-lg p-4 mt-4">
              <p className="text-sm font-semibold text-emerald-800">{config.salonInvestments.newClientsPerMonth}+ new clients/month</p>
              <p className="text-xs text-stone-500 mt-1">
                The salon's front desk, marketing, and walk-in traffic keep your
                book full — no need to build your own pipeline from scratch.
              </p>
            </div>
            )}
          </div>
          )}

          {/* Commission Breakdown */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60 mb-8">
            <h4 className="text-xs font-semibold text-stone-500 mb-3 uppercase tracking-wider">Weekly Commission Breakdown</h4>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-200">
              <span className="text-sm text-stone-500">Avg Weekly Sales</span>
              <span className="text-sm font-semibold text-stone-700">{formatCurrency(calculations.avgWeeklySales)}</span>
            </div>
            {calculations.commissionType === 'tiered' && calculations.tierBreakdown.map((tier, i) => (
              <div key={i} className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100 last:border-b-0">
                <span className="text-sm text-stone-500">
                  {tier.rangeLabel} <span className="text-stone-400">@ </span>
                  {i === 0 ? (
                    <span className="inline-flex items-center">
                      <select className="px-1 py-0.5 border border-stone-300 rounded text-[14px] text-center font-semibold text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 bg-white" value={inputs.startingRate} onChange={(e) => handleChange('startingRate', e.target.value)}>
                        <option value="40">40%</option>
                        <option value="45">45%</option>
                        <option value="50">50%</option>
                        <option value="55">55%</option>
                      </select>
                    </span>
                  ) : (
                    <span className="text-stone-400">{(tier.rate * 100).toFixed(0)}%</span>
                  )}
                </span>
                <span className="text-sm font-medium text-stone-700">
                  <span className="text-stone-400 text-xs mr-1">({formatCurrency(tier.amount)})</span>
                  {formatCurrency(tier.commission)}
                </span>
              </div>
            ))}
            {calculations.commissionType === 'flat' && (
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100">
                <span className="text-sm text-stone-500">
                  Flat Rate <span className="text-stone-400">@ </span>
                  <span className="inline-flex items-center">
                    <select className="px-1 py-0.5 border border-stone-300 rounded text-[14px] text-center font-semibold text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 bg-white" value={inputs.startingRate} onChange={(e) => handleChange('startingRate', e.target.value)}>
                      <option value="40">40%</option>
                      <option value="45">45%</option>
                      <option value="50">50%</option>
                      <option value="55">55%</option>
                    </select>
                  </span>
                </span>
                <span className="text-sm font-medium text-stone-700">{formatCurrency(calculations.tierBreakdown[0]?.commission)}</span>
              </div>
            )}
          </div>

          {/* Results */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Current vs Renter Comparison</h3>

            {/* Client Retention Slider */}
            <div className="bg-amber-50 border border-amber-200/60 rounded-lg p-4 mb-4">
              <div className="flex items-center justify-between mb-2">
                <label className="text-sm font-medium text-amber-800">How many clients will follow you?</label>
                <span className="text-lg font-bold text-amber-700">{clientRetention}%</span>
              </div>
              <input type="range" min="50" max="100" step="5" value={clientRetention} onChange={(e) => setClientRetention(Number(e.target.value))} className="w-full accent-amber-500" />
              <div className="flex justify-between text-[10px] text-stone-400 mt-1">
                <span>50%</span>
                <span>100%</span>
              </div>
              <p className="text-xs text-stone-500 mt-2">
                {calculations.crossoverRetention > 0
                  ? `Breakeven: ${(100 - calculations.crossoverRetention).toFixed(0)}% retention — lose more and renting costs you money`
                  : 'Renting costs more even keeping all clients'}
              </p>
            </div>

            {/* Side-by-side comparison cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <div className="bg-emerald-50 border border-emerald-200/60 rounded-lg p-4 text-center">
                <p className="text-xs text-emerald-600 font-medium mb-1">Commission Take-Home (after taxes)</p>
                <p className="text-2xl font-bold text-emerald-700">{formatCurrency(calculations.adjustedCurrentTakeHome)}</p>
                <p className="text-xs text-stone-400 mt-1">after FICA</p>
              </div>
              <div className="bg-amber-50 border border-amber-200/60 rounded-lg p-4 text-center">
                <p className="text-xs text-amber-600 font-medium mb-1">Estimated Renter Take-Home (after taxes)</p>
                <p className="text-2xl font-bold text-amber-700">{formatCurrency(renterTakeHome)}</p>
                <p className="text-xs text-stone-400 mt-1">at {clientRetention}% client retention</p>
              </div>
            </div>

            {/* Verdict */}
            {(() => {
              const diff = renterTakeHome - calculations.adjustedCurrentTakeHome;
              return (
                <div className={`border-2 rounded-lg p-5 text-center shadow-md mb-6 ${diff >= 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <span className={`text-xs font-semibold uppercase tracking-wider ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    {diff >= 0 ? "You'd Gain by Renting" : "You'd Lose by Renting"}
                  </span>
                  <p className={`text-4xl sm:text-5xl font-extrabold mt-2 ${diff >= 0 ? 'text-emerald-700' : 'text-red-700'}`}>
                    {diff >= 0 ? '+' : ''}{formatCurrency(diff)}
                    <span className="text-lg font-semibold opacity-70">/yr</span>
                  </p>
                  <p className={`text-sm font-medium mt-1 ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    That's {diff >= 0 ? '+' : ''}{formatCurrency(Math.round(diff / 12))}/mo
                  </p>
                  <p className="text-xs text-stone-500 mt-3 leading-relaxed">
                    {diff >= 0
                      ? 'Keep in mind that renting means taking on hidden costs — managing your own bookings, sourcing supplies, doing your own laundry, and filing 1099 taxes. That\'s roughly 10 hours a week spent running a business instead of doing hair.'
                      : 'On commission, the salon handles booking, supplies, marketing, and laundry — plus you pay lower payroll taxes (7.65% vs 15.3%).'}
                  </p>
                </div>
              );
            })()}

            {/* Commission Breakdown */}
            <h4 className="text-xs font-semibold uppercase tracking-wider text-stone-400 mb-2">Commission Breakdown</h4>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100">
              <span className="text-xs text-stone-400">Current Commission Take-Home</span>
              <span className="text-sm text-stone-400">{formatCurrency(calculations.currentTakeHome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-1.5 pl-4 border-b border-stone-100">
              <span className="text-xs text-stone-400">FICA (7.65%)</span>
              <span className="text-sm text-red-600">−{formatCurrency(calculations.commissionFica)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200 mb-4">
              <span className="text-sm font-medium text-stone-700">After-Tax Commission Take-Home</span>
              <span className="text-lg font-bold text-stone-700">{formatCurrency(calculations.adjustedCurrentTakeHome)}</span>
            </div>

            {/* Renter Breakdown */}
            <h4 className="text-xs font-semibold uppercase tracking-wider text-stone-400 mb-2">Renter Breakdown</h4>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100">
              <span className="text-xs text-stone-400">Renter Income at {clientRetention}% retention</span>
              <span className="text-sm text-stone-400">{formatCurrency(retainedIncome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-1.5 pl-4 border-b border-stone-100">
              <span className="text-xs text-stone-400">Total Renter COGS</span>
              <span className="text-sm text-red-600">−{formatCurrency(calculations.totalCOGS)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-1.5 pl-4 border-b border-stone-100">
              <span className="text-xs text-stone-400">Self-Employment Tax (15.3%)</span>
              <span className="text-sm text-red-600">−{formatCurrency(renterSeTax.seTax)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3">
              <span className="text-sm font-medium text-stone-700">After-Tax Renter Take-Home</span>
              <span className="text-lg font-bold text-stone-700">{formatCurrency(renterTakeHome)}</span>
            </div>

            {/* Scenarios */}
            <div className="mt-6">
              <button type="button" onClick={() => setShowScenarios(prev => !prev)} className="flex items-center gap-2 text-sm text-stone-500 hover:text-stone-700 transition-colors mb-3">
                <span className={`inline-block transition-transform ${showScenarios ? 'rotate-90' : ''}`}>&#9654;</span>
                View all retention scenarios
              </button>
              {showScenarios && (
              <div>
                <h3 className="text-sm font-semibold text-stone-700 mb-3 pb-2 border-b-2 border-stone-100">After-Tax Renter Scenarios (Client Retention)</h3>
                {calculations.adjustedScenarios.map(({ retention, adjustedTakeHome }) => {
                  const prev = calculations.adjustedScenarios.find(s => s.retention === retention - 10);

                <div className="flex flex-col">
                  <label className={settingLabel}>Laundry Description</label>
                  <input type="text" className={textInput} value={config.salonInvestments.laundryDescription} onChange={(e) => updateInvestment('laundryDescription', e.target.value)} />
                </div>
                <div className="flex flex-col">
                  <label className={settingLabel}>Front Desk (Annual)</label>
                  <CurrencyInput value={config.salonInvestments.frontDeskAnnual} onChange={(e) => updateInvestment('frontDeskAnnual', parseFloat(e.target.value) || 0)} />
                </div>
                <div className="flex flex-col">
                  <label className={settingLabel}>Front Desk Description</label>
                  <input type="text" className={textInput} value={config.salonInvestments.frontDeskDescription} onChange={(e) => updateInvestment('frontDeskDescription', e.target.value)} />
                </div>
                <div className="flex flex-col">
                  <label className={settingLabel}>New Clients Per Month</label>
                  <input type="number" className={inputClass} value={config.salonInvestments.newClientsPerMonth} onChange={(e) => updateInvestment('newClientsPerMonth', parseFloat(e.target.value) || 0)} />
                </div>
              </div>
            </div>

            {/* Defaults */}
            <div className={sectionClass}>
              <h3 className={sectionTitle}>Defaults</h3>
              <div className="grid grid-cols-1 gap-4">
                <div className="flex flex-col">
                  <label className={settingLabel}>Default Tip %</label>
                  <div className="relative">
                    <input type="number" className={inputClass + " pr-8"} value={config.defaultTipPercent} onChange={(e) => update('defaultTipPercent', parseFloat(e.target.value) || 0)} />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-stone-400 pointer-events-none">%</span>
                  </div>
                </div>
                <div className="flex flex-col">
                  <label className={settingLabel}>Default Tab</label>
                  <select className={textInput} value={config.defaultTab} onChange={(e) => update('defaultTab', e.target.value)}>
                    <option value="renter-to-commission">Renter → Commission</option>
                    <option value="commission-to-renter">Commission → Renter</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Reset */}
            <button type="button" onClick={resetDefaults} className="w-full py-3 px-4 border-2 border-red-200 text-red-600 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors">
              Reset to Defaults
            </button>
          </div>
        </div>
      );
    };

    const App = () => {
      const [config, setConfig] = useConfigState('salon-config', SALON_CONFIG);
      const [activeTab, setActiveTab] = useState(() => getTabFromHash(config.defaultTab));

      // Sync hash -> tab on popstate (back/forward)
      useEffect(() => {
        const onHashChange = () => setActiveTab(getTabFromHash(config.defaultTab));
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, [config.defaultTab]);

      // Sync tab -> hash on click
      const switchTab = (tab) => {
        window.location.hash = tab;
        setActiveTab(tab);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 md:py-12">
          <div className="flex items-start justify-between mb-8">
            <div>
              <h1 className="text-2xl md:text-3xl font-bold text-stone-900 tracking-tight">{config.toolName}</h1>
              <p className="text-sm text-stone-500 mt-1">See the real numbers behind commission vs renting</p>
              <button
                onClick={() => window.print()}
                className="text-xs text-stone-400 hover:text-stone-600 transition-colors print:hidden"
              >
                Print Summary
              </button>
            </div>
            {activeTab !== 'settings' && (
              <button
                onClick={() => switchTab('settings')}
                className="p-2 text-stone-400 hover:text-stone-600 transition-colors print:hidden"
                title="Settings"
              >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clipRule="evenodd" />
                </svg>
              </button>
            )}
          </div>

          {/* Tab bar — hidden on settings page */}
          {activeTab !== 'settings' && (
            <div className="flex rounded-lg overflow-hidden border border-stone-300 mb-6 print:hidden">
              <button
                onClick={() => switchTab('renter-to-commission')}
                className={`flex-1 px-4 py-2.5 text-sm font-medium transition-colors ${activeTab === 'renter-to-commission' ? 'bg-amber-500 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'}`}
              >
                Renter &rarr; Commission
              </button>
              <button
                onClick={() => switchTab('commission-to-renter')}
                className={`flex-1 px-4 py-2.5 text-sm font-medium transition-colors ${activeTab === 'commission-to-renter' ? 'bg-amber-500 text-white' : 'bg-white text-stone-600 hover:bg-stone-50'}`}
              >
                Commission &rarr; Renter
              </button>
            </div>
          )}

          {activeTab === 'settings'
            ? <SettingsPanel config={config} setConfig={setConfig} onBack={() => switchTab(config.defaultTab)} />
            : activeTab === 'commission-to-renter'
              ? <CommissionToRenter config={config} />
              : <RenterToCommission config={config} />
          }

          <p className="text-center text-xs text-stone-400 mt-8">{config.salonName} &middot; {config.toolName}</p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
