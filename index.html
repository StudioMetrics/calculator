<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Studio Metrics - Commission vs Renter Calculator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="calculator.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Hide number input spinners for cleaner look */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; text-align: right !important; }
    /* Prevent tap highlight on mobile */
    button { -webkit-tap-highlight-color: transparent; }
    @media print {
      body { background: white !important; }
      button { display: none !important; }
      .print\:hidden { display: none !important; }
      input { border: none !important; background: transparent !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Core math & formatting loaded from calculator.js
    // (formatCurrency, formatPercent, calculateCommissionToRenter, calculateRenterToCommission)

    // Persist state in localStorage so values survive refresh / tab close
    const usePersistedState = (key, defaultValue) => {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : defaultValue;
        } catch { return defaultValue; }
      });
      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(state));
      }, [key, state]);
      return [state, setState];
    };

    // Currency input: shows "$1,234" when blurred, raw number when editing
    const CurrencyInput = ({ value, onChange, ...props }) => {
      const [focused, setFocused] = useState(false);
      const display = focused ? (value || '') : formatCurrency(value);
      return (
        <input
          type={focused ? 'number' : 'text'}
          value={display}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
          onChange={onChange}
          className="w-full px-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 text-right transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
          {...props}
        />
      );
    };

    // Shared input styling
    const inputClass = "w-full px-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 text-right transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500";
    const readOnlyClass = "w-full px-3 py-3 border border-stone-200 rounded-lg text-[16px] leading-6 bg-stone-100 text-stone-500";
    const labelClass = "text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider";
    const helpClass = "text-xs text-stone-400 mt-1";

    // Rent toggle: lets user enter weekly or yearly, stores weekly internally
    const RentInput = ({ weeklyRent, onChange, helpClass }) => {
      const [mode, setMode] = useState('weekly');
      const displayValue = mode === 'weekly' ? weeklyRent : Math.round(weeklyRent * 52);
      const helperText = mode === 'weekly'
        ? `${formatCurrency(weeklyRent * 52)}/yr`
        : `${formatCurrency(weeklyRent)}/wk`;

      const handleRentChange = (e) => {
        const raw = parseFloat(e.target.value) || 0;
        onChange(mode === 'weekly' ? raw : raw / 52);
      };

      return (
        <div className="flex flex-col">
          <div className="flex items-center justify-between mb-1">
            <label className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Booth Rent</label>
            <div className="flex rounded-md overflow-hidden border border-stone-300 text-[11px]">
              <button type="button" onClick={() => setMode('weekly')} className={`px-2 py-0.5 font-medium transition-colors ${mode === 'weekly' ? 'bg-amber-500 text-white' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}`}>Weekly</button>
              <button type="button" onClick={() => setMode('yearly')} className={`px-2 py-0.5 font-medium transition-colors ${mode === 'yearly' ? 'bg-amber-500 text-white' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}`}>Yearly</button>
            </div>
          </div>
          <CurrencyInput value={displayValue} onChange={handleRentChange} />
          <span className={helpClass}>{helperText}</span>
        </div>
      );
    };

    // Commission to Renter Calculator
    const CommissionToRenter = () => {
      const [inputs, setInputs] = usePersistedState('c2r-inputs', {
        serviceIncome: 100000,
        tips: 18000,
        startingRate: 40,
        weeklyRent: 525,
        colorSupplies: 10125,
        marketing: 1200,
        assistantHourly: 20,
        assistantHours: 6,
        assistantDays: 4,
        asstTaxPct: 7,
        ccFeePct: 2.9,
      });

      const handleChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
      };

      const calculations = useMemo(() => calculateCommissionToRenter(inputs), [inputs]);

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
          {/* Hero Summary - Retention Warning */}
          <div className="bg-red-50 border border-red-200 rounded-xl p-5 mb-8">
            <p className="text-sm font-medium text-red-800 mb-1">Client Loss Breakeven</p>
            <p className="text-3xl sm:text-4xl font-bold text-red-700">
              {calculations.crossoverRetention > 0
                ? `${calculations.crossoverRetention.toFixed(0)}% client loss`
                : 'Renting costs more even keeping all clients'}
            </p>
            <p className="text-xs text-red-600 mt-1">
              {calculations.crossoverRetention > 0
                ? `If more than ${calculations.crossoverRetention.toFixed(0)}% of your clients don't follow you, renting loses money`
                : 'The math doesn\'t support switching to renting at current rates'}
            </p>
          </div>

          {/* Income Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Income</h3>
            <div className="grid grid-cols-1 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Service Income</label>
                <CurrencyInput value={inputs.serviceIncome} onChange={(e) => handleChange('serviceIncome', e.target.value)} />
                <span className={helpClass}>Total services billed</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Tips</label>
                <CurrencyInput value={inputs.tips} onChange={(e) => handleChange('tips', e.target.value)} />
                <span className={helpClass}>Cash tips received</span>
              </div>
            </div>
          </div>

          {/* Costs Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Costs (COGS)</h3>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <RentInput weeklyRent={inputs.weeklyRent} onChange={(v) => handleChange('weeklyRent', v)} helpClass={helpClass} />
              <div className="flex flex-col">
                <label className={labelClass}>Your Color &amp; Supplies</label>
                <CurrencyInput value={inputs.colorSupplies} onChange={(e) => handleChange('colorSupplies', e.target.value)} />
                <span className={helpClass}>Annual color, backbar, tools</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Your Marketing</label>
                <CurrencyInput value={inputs.marketing} onChange={(e) => handleChange('marketing', e.target.value)} />
                <span className={helpClass}>Annual advertising, social, etc.</span>
              </div>
            </div>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hourly Rate</label>
                <CurrencyInput value={inputs.assistantHourly} onChange={(e) => handleChange('assistantHourly', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hours/Day</label>
                <input type="number" className={inputClass} value={inputs.assistantHours} onChange={(e) => handleChange('assistantHours', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Days/Week</label>
                <input type="number" className={inputClass} value={inputs.assistantDays} onChange={(e) => handleChange('assistantDays', e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-1 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Tax %</label>
                <input type="number" className={inputClass} value={inputs.asstTaxPct} onChange={(e) => handleChange('asstTaxPct', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Credit Card Fee %</label>
                <input type="number" className={inputClass} value={inputs.ccFeePct} onChange={(e) => handleChange('ccFeePct', e.target.value)} />
              </div>
            </div>
          </div>

          {/* Salon Benefits You Currently Receive */}
          <div className="bg-emerald-50 border border-emerald-200/60 rounded-xl p-5 md:p-6 mb-8">
            <h3 className="text-sm font-semibold text-emerald-800 mb-4">Benefits You Currently Receive</h3>
            {calculations.salonBenefitsBreakdown.map((benefit, i) => (
              <div key={i} className="flex items-center justify-between gap-2 py-1.5">
                <span className="text-sm text-stone-700">&#10003; {benefit.label}</span>
                <span className="text-sm font-semibold text-emerald-700">{formatCurrency(benefit.amount)}/yr</span>
              </div>
            ))}
            <div className="mt-3 pt-3 border-t border-emerald-200/60 flex flex-wrap justify-between items-baseline gap-x-4">
              <span className="text-sm font-semibold text-emerald-800">Total Benefits Value</span>
              <span className="text-lg font-bold text-emerald-700">{formatCurrency(calculations.salonBenefitsValue)}/yr</span>
            </div>
            <p className="text-xs text-stone-500 mt-2">You'd pay for all of these yourself as a renter, plus self-employment tax (~14%)</p>
          </div>

          {/* Tier Breakdown */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60 mb-8">
            <h4 className="text-xs font-semibold text-stone-500 mb-3 uppercase tracking-wider">Weekly Commission Breakdown</h4>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-200">
              <span className="text-sm text-stone-500">Avg Weekly Sales</span>
              <span className="text-sm font-semibold text-stone-700">{formatCurrency(calculations.avgWeeklySales)}</span>
            </div>
            {calculations.tierBreakdown.map((tier, i) => (
              <div key={i} className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100 last:border-b-0">
                <span className="text-sm text-stone-500">
                  {tier.rangeLabel} <span className="text-stone-400">@ </span>
                  {i === 0 ? (
                    <span className="inline-flex items-center">
                      <input type="number" className="w-12 px-1 py-0.5 border border-stone-300 rounded text-[14px] text-center font-semibold text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 bg-white" min="40" max="50" value={inputs.startingRate} onChange={(e) => handleChange('startingRate', e.target.value)} />
                      <span className="text-stone-400">%</span>
                    </span>
                  ) : (
                    <span className="text-stone-400">{(tier.rate * 100).toFixed(0)}%</span>
                  )}
                </span>
                <span className="text-sm font-medium text-stone-700">
                  <span className="text-stone-400 text-xs mr-1">({formatCurrency(tier.amount)})</span>
                  {formatCurrency(tier.commission)}
                </span>
              </div>
            ))}
            <div className="bg-orange-50 border border-orange-200/60 rounded-lg p-4 mt-4">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Effective Commission Rate</span>
                <span className="text-xl sm:text-2xl font-bold text-orange-700">
                  {(calculations.effectiveRate * 100).toFixed(1)}%
                </span>
              </div>
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1 mt-2">
                <span className="text-sm text-stone-600">Annual Commission Gross</span>
                <span className="text-lg font-bold text-orange-700">{formatCurrency(calculations.commissionGross)}</span>
              </div>
            </div>
          </div>

          {/* Results */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Current vs Renter Comparison</h3>

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Current Commission Take-Home</span>
              <span className="text-lg font-bold text-emerald-700">{formatCurrency(calculations.currentTakeHome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Total Renter COGS</span>
              <span className="text-lg font-bold text-red-700">{formatCurrency(calculations.totalCOGS)}</span>
            </div>

            <div className="bg-amber-50 border border-amber-200/60 rounded-lg p-4 mt-4">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Renter Take-Home (no client loss)</span>
                <span className="text-xl sm:text-2xl font-bold text-amber-700">{formatCurrency(calculations.scenarios[0].takeHome)}</span>
              </div>
            </div>

            {/* Scenarios */}
            <div className="mt-6">
              <h3 className="text-sm font-semibold text-stone-700 mb-3 pb-2 border-b-2 border-stone-100">Renter Scenarios (Client Retention)</h3>
              {calculations.scenarios.map(({ retention, takeHome }) => {
                const isCrossover = retention > 0 &&
                  calculations.scenarios.find(s => s.retention === retention - 10)?.takeHome >= calculations.currentTakeHome &&
                  takeHome < calculations.currentTakeHome;
                return (
                  <React.Fragment key={retention}>
                    {isCrossover && (
                      <div className="flex items-center gap-2 py-2">
                        <div className="flex-1 border-t-2 border-red-300"></div>
                        <span className="text-xs font-semibold text-red-500 whitespace-nowrap">Breakeven Point</span>
                        <div className="flex-1 border-t-2 border-red-300"></div>
                      </div>
                    )}
                    <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2.5 border-b border-stone-100 last:border-b-0">
                      <span className="text-sm text-stone-600">
                        {retention === 0 ? 'You keep all your clients' : `You keep ${100 - retention}% of your clients`}
                      </span>
                      <span className={`text-base font-semibold ${takeHome > calculations.currentTakeHome ? 'text-emerald-700' : 'text-red-700'}`}>
                        {formatCurrency(takeHome)}
                      </span>
                    </div>
                  </React.Fragment>
                );
              })}
            </div>

            <div className="bg-emerald-50 border border-emerald-200/60 rounded-lg p-4 mt-5">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Break-Even Weekly Rent</span>
                <span className="text-xl sm:text-2xl font-bold text-emerald-700">{formatCurrency(calculations.maxRentWeekly)}/week</span>
              </div>
              <p className="text-xs text-stone-400 mt-2">Maximum rent you could pay to match current commission income. Studio suites in the area typically rent for $250–$400/week</p>
            </div>
          </div>
        </div>
      );
    };

    // Renter to Commission Calculator
    const RenterToCommission = () => {
      const [inputs, setInputs] = usePersistedState('r2c-inputs', {
        serviceIncome: 100000,
        tips: 18000,
        startingRate: 40,
        weeklyRent: 525,
        colorSupplies: 10125,
        marketing: 3500,
        laundry: 0,
        ccFeePct: 2.9,
        otherExpenses: 1500,
      });

      const handleChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
      };

      const calculations = useMemo(() => calculateRenterToCommission(inputs), [inputs]);

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
          {/* Section 1: Your Current Renter Income (inputs merged into card) */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60 mb-8">
            <h2 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Your Current Renter Income</h2>

            <div className="grid grid-cols-1 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Service Income</label>
                <CurrencyInput value={inputs.serviceIncome} onChange={(e) => handleChange('serviceIncome', e.target.value)} />
                <span className={helpClass}>Total services billed</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Tips</label>
                <CurrencyInput value={inputs.tips} onChange={(e) => handleChange('tips', e.target.value)} />
              </div>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500 font-bold">Total Gross Income</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.totalIncome)}</span>
            </div>
            <br/>
            <h2 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Expenses</h2>
            <div className="grid grid-cols-1 gap-4 mb-4">
              <RentInput weeklyRent={inputs.weeklyRent} onChange={(v) => handleChange('weeklyRent', v)} helpClass={helpClass} />
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Color &amp; Supplies</label>
                <CurrencyInput value={inputs.colorSupplies} onChange={(e) => handleChange('colorSupplies', e.target.value)} />
                <span className={helpClass}>Annual color, backbar, tools</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Marketing</label>
                <CurrencyInput value={inputs.marketing} onChange={(e) => handleChange('marketing', e.target.value)} />
                <span className={helpClass}>Annual advertising, social, etc.</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Yearly Laundry</label>
                <CurrencyInput value={inputs.laundry} onChange={(e) => handleChange('laundry', e.target.value)} />
                <span className={helpClass}>Annual towels, capes, etc.</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Other Yearly Expenses</label>
                <CurrencyInput value={inputs.otherExpenses} onChange={(e) => handleChange('otherExpenses', e.target.value)} />
                <span className={helpClass}>Insurance, licensing, continuing ed, etc.</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Credit Card Fee %</label>
                <input type="number" className={inputClass} step="0.1" value={inputs.ccFeePct} onChange={(e) => handleChange('ccFeePct', e.target.value)} />
                <span className={helpClass}>Applied to total income including tips</span>
              </div>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2">
              <span className="text-sm text-red-500">Total Annual Expenses</span>
              <span className="text-sm font-semibold text-red-600">-{formatCurrency(calculations.totalExpenses)}</span>
            </div>
            <div className="border-t border-stone-300 my-1"></div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Take-Home Before Taxes</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.currentTakeHome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-200">
              <div>
                <span className="text-sm text-red-500">Self-Employment Tax (15.3%)</span>
                <p className="text-xs text-stone-400">Federal — renters pay both employer + employee FICA</p>
              </div>
              <span className="text-sm font-semibold text-red-600">-{formatCurrency(calculations.selfEmploymentTax)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3">
              <span className="text-sm font-medium text-stone-700">Estimated Renter Take-Home</span>
              <span className="text-xl sm:text-2xl font-bold text-stone-900">{formatCurrency(calculations.adjustedRenterTakeHome)}</span>
            </div>
          </div>

          {/* Section 2: Estimated Commission Income */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60 mb-8">
            <h2 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Estimated Commission Income</h2>

            <h3 className="text-xs font-semibold text-stone-500 mb-3 uppercase tracking-wider">Weekly Commission Breakdown</h3>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-200">
              <span className="text-sm text-stone-500">Avg Weekly Service Income</span>
              <span className="text-sm font-semibold text-stone-700">{formatCurrency(calculations.avgWeeklySales)}</span>
            </div>
            {calculations.tierBreakdown.map((tier, i) => (
              <div key={i} className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-100 last:border-b-0">
                <span className="text-sm text-stone-500">
                  {tier.rangeLabel} <span className="text-stone-400">@ </span>
                  {i === 0 ? (
                    <span className="inline-flex items-center">
                      <input type="number" className="w-12 px-1 py-0.5 border border-stone-300 rounded text-[14px] text-center font-semibold text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 bg-white" min="40" max="50" value={inputs.startingRate} onChange={(e) => handleChange('startingRate', e.target.value)} />
                      <span className="text-stone-400">%</span>
                    </span>
                  ) : (
                    <span className="text-stone-400">{(tier.rate * 100).toFixed(0)}%</span>
                  )}
                </span>
                <span className="text-sm font-medium text-stone-700">
                  <span className="text-stone-400 text-xs mr-1">({formatCurrency(tier.amount)})</span>
                  {formatCurrency(tier.commission)}
                </span>
              </div>
            ))}

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-t border-stone-300">
              <span className="text-sm text-stone-500 font-bold">Weekly Gross Commission</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.weeklyCommission)}</span>
            </div>

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Annual Commission + Tips</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.commissionIncome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-2 border-b border-stone-200">
              <div>
                <span className="text-sm text-red-500">Commission FICA (7.65%)</span>
                <p className="text-xs text-stone-400">Federal — employee share only, salon pays the other half</p>
              </div>
              <span className="text-sm font-semibold text-red-600">-{formatCurrency(calculations.commissionFica)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3">
              <span className="text-sm font-medium text-stone-700">Estimated Commission Take-Home</span>
              <span className="text-xl sm:text-2xl font-bold text-stone-900">{formatCurrency(calculations.adjustedCommissionIncome)}</span>
            </div>
          </div>

          {/* Section 4: Take-Home Pay Comparison */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60 mb-8">
            <h2 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Take-Home Pay Comparison</h2>

            {/* Side-by-side comparison */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <div className="bg-amber-50 border border-amber-200/60 rounded-lg p-4 text-center">
                <p className="text-xs text-amber-600 font-medium mb-1">As a Renter</p>
                <p className="text-2xl font-bold text-amber-700">{formatCurrency(calculations.adjustedRenterTakeHome)}</p>
                <p className="text-xs text-stone-400 mt-1">after self-employment tax</p>
              </div>
              <div className="bg-emerald-50 border border-emerald-200/60 rounded-lg p-4 text-center">
                <p className="text-xs text-emerald-600 font-medium mb-1">On Commission</p>
                <p className="text-2xl font-bold text-emerald-700">{formatCurrency(calculations.adjustedCommissionIncome)}</p>
                <p className="text-xs text-stone-400 mt-1">after FICA</p>
              </div>
            </div>

            {/* Verdict */}
            <div className={`border-2 rounded-lg p-5 text-center shadow-md ${calculations.adjustedDifference >= 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-stone-100 border-stone-300'}`}>
              <span className={`text-xs font-semibold uppercase tracking-wider ${calculations.adjustedDifference >= 0 ? 'text-emerald-600' : 'text-stone-500'}`}>
                {calculations.adjustedDifference >= 0 ? 'The Verdict: You\'d Gain' : 'Annual Difference'}
              </span>
              <p className={`text-4xl sm:text-5xl font-extrabold mt-2 ${calculations.adjustedDifference >= 0 ? 'text-emerald-700' : 'text-stone-700'}`}>
                {calculations.adjustedDifference >= 0 ? '+' : ''}{formatCurrency(calculations.adjustedDifference)}
                <span className="text-lg font-semibold opacity-70">/yr</span>
              </p>
              <p className={`text-sm font-medium mt-1 ${calculations.adjustedDifference >= 0 ? 'text-emerald-600' : 'text-stone-500'}`}>
                That's {calculations.adjustedDifference >= 0 ? '+' : ''}{formatCurrency(Math.round(calculations.adjustedDifference / 12))}/mo in your pocket
              </p>
              <p className="text-xs text-stone-500 mt-3 leading-relaxed">
                {calculations.adjustedDifference >= 0
                  ? 'Plus, on commission you skip the hidden costs of running your own business — no chasing bookings, no managing supplies, no doing your own laundry. That\'s roughly 10 hours a week (500+ hours a year) you get back to spend behind the chair or at home.'
                  : 'Even at a lower take-home, consider the hidden costs of renting — managing your own bookings (1–2 hrs/night), sourcing supplies, doing your own laundry, filing 1099 taxes. That\'s roughly 10 hours a week you spend running a business instead of doing hair.'}
              </p>
            </div>
          </div>

          {/* Section 5: What's Included with Commission */}
          <div className="bg-amber-50 border border-amber-200/60 rounded-xl p-5 md:p-6">
            <h2 className="text-sm font-semibold text-amber-800 mb-4">What's Included with Commission</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {calculations.salonBenefitsBreakdown.map((benefit, i) => (
                <div key={i} className="flex items-center justify-between gap-2">
                  <span className="text-sm text-stone-700">&#10003; {benefit.label}</span>
                  <span className="text-sm font-semibold text-amber-700">{formatCurrency(benefit.amount)}/yr</span>
                </div>
              ))}
              <div className="flex items-center justify-between gap-2">
                <span className="text-sm text-stone-700">&#10003; Front Desk &amp; Support</span>
                <span className="text-sm text-stone-400 italic">Included</span>
              </div>
              <div className="flex items-center justify-between gap-2">
                <span className="text-sm text-stone-700">&#10003; Lower Payroll Taxes</span>
                <span className="text-sm font-semibold text-emerald-600">Save {formatCurrency(calculations.seTaxPenalty)}/yr</span>
              </div>
            </div>
            <div className="mt-4 pt-3 border-t border-amber-200/60 flex flex-wrap justify-between items-baseline gap-x-4">
              <span className="text-sm font-semibold text-amber-800">Total Value of Benefits</span>
              <span className="text-lg font-bold text-amber-700">{formatCurrency(calculations.salonBenefitsValue + calculations.seTaxPenalty)}/yr</span>
            </div>
            {/* Client flow callout */}
            <div className="bg-white/60 border border-amber-200 rounded-lg p-4 mt-4">
              <p className="text-sm font-semibold text-amber-800">100+ new clients/month</p>
              <p className="text-xs text-stone-500 mt-1">
                The salon's front desk, marketing, and walk-in traffic keep your
                book full — no need to build your own pipeline from scratch.
              </p>
            </div>
            <p className="text-xs text-stone-500 mt-3 leading-relaxed">On commission, the salon handles booking, front desk, supplies ordering, credit card processing, marketing, and laundry — you just show up and do great hair.</p>
          </div>
        </div>
      );
    };

    const VALID_TABS = ['commission-to-renter', 'renter-to-commission'];
    const getTabFromHash = () => {
      const hash = window.location.hash.replace('#', '');
      return VALID_TABS.includes(hash) ? hash : 'renter-to-commission';
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState(getTabFromHash);

      // Sync hash -> tab on popstate (back/forward)
      useEffect(() => {
        const onHashChange = () => setActiveTab(getTabFromHash());
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      // Sync tab -> hash on click
      const switchTab = (tab) => {
        window.location.hash = tab;
        setActiveTab(tab);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 md:py-12">
          <div className="mb-8">
            <h1 className="text-2xl md:text-3xl font-bold text-stone-900 tracking-tight">Studio Metrics</h1>
            <p className="text-sm text-stone-500 mt-1">See the real numbers behind commission vs renting</p>
            <button
              onClick={() => window.print()}
              className="text-xs text-stone-400 hover:text-stone-600 transition-colors print:hidden"
            >
              Print Summary
            </button>
          </div>

          {/* Tab bar hidden for now — C2R tab still accessible via #commission-to-renter */}
          {activeTab === 'commission-to-renter' ? <CommissionToRenter /> : <RenterToCommission />}

          <p className="text-center text-xs text-stone-400 mt-8">Studio Los Gatos &middot; StudioMetrics</p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
