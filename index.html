<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Studio Metrics - Commission vs Renter Calculator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="calculator.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Hide number input spinners for cleaner look */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    /* Prevent tap highlight on mobile */
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-stone-50 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Core math & formatting loaded from calculator.js
    // (formatCurrency, formatPercent, calculateCommissionToRenter, calculateRenterToCommission)

    // Persist state in localStorage so values survive refresh / tab close
    const usePersistedState = (key, defaultValue) => {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : defaultValue;
        } catch { return defaultValue; }
      });
      useEffect(() => {
        localStorage.setItem(key, JSON.stringify(state));
      }, [key, state]);
      return [state, setState];
    };

    // Currency input: shows "$1,234" when blurred, raw number when editing
    const CurrencyInput = ({ value, onChange, ...props }) => {
      const [focused, setFocused] = useState(false);
      const display = focused ? (value || '') : formatCurrency(value);
      return (
        <input
          type={focused ? 'number' : 'text'}
          value={display}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
          onChange={onChange}
          className="w-full px-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500"
          {...props}
        />
      );
    };

    // Shared input styling
    const inputClass = "w-full px-3 py-3 border border-stone-300 rounded-lg text-[16px] leading-6 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500";
    const readOnlyClass = "w-full px-3 py-3 border border-stone-200 rounded-lg text-[16px] leading-6 bg-stone-100 text-stone-500";
    const labelClass = "text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider";
    const helpClass = "text-xs text-stone-400 mt-1";

    // Commission to Renter Calculator
    const CommissionToRenter = () => {
      const [inputs, setInputs] = usePersistedState('c2r-inputs', {
        serviceIncome: 201965,
        tips: 32099,
        commissionPct: 50,
        weeklyRent: 525,
        assistantHourly: 20,
        assistantHours: 6,
        assistantDays: 4,
        asstTaxPct: 7,
        ccFeePct: 2.9,
        salonCogs: 96413,
        salonMarketing: 33375,
        totalStylistHours: 16375.25,
        stylistHours: 1719.82,
      });

      const handleChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
      };

      const calculations = useMemo(() => calculateCommissionToRenter(inputs), [inputs]);

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
          {/* Income Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Income</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Annual Service Income</label>
                <CurrencyInput value={inputs.serviceIncome} onChange={(e) => handleChange('serviceIncome', e.target.value)} />
                <span className={helpClass}>Total services billed</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Annual Tips</label>
                <CurrencyInput value={inputs.tips} onChange={(e) => handleChange('tips', e.target.value)} />
                <span className={helpClass}>Cash tips received</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Commission %</label>
                <input type="number" className={inputClass} value={inputs.commissionPct} onChange={(e) => handleChange('commissionPct', e.target.value)} />
                <span className={helpClass}>Current commission split</span>
              </div>
            </div>
          </div>

          {/* Stylist Usage Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Stylist Usage</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Your Hours Worked</label>
                <input type="number" className={inputClass} value={inputs.stylistHours} onChange={(e) => handleChange('stylistHours', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Total Salon Hours</label>
                <input type="number" className={inputClass} value={inputs.totalStylistHours} onChange={(e) => handleChange('totalStylistHours', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Your Usage %</label>
                <input type="text" className={readOnlyClass} value={formatPercent(calculations.usagePct)} readOnly />
              </div>
            </div>
          </div>

          {/* Costs Section */}
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Costs (COGS)</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Weekly Rent</label>
                <CurrencyInput value={inputs.weeklyRent} onChange={(e) => handleChange('weeklyRent', e.target.value)} />
                <span className={helpClass}>Booth rental rate</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Total Salon COGS</label>
                <CurrencyInput value={inputs.salonCogs} onChange={(e) => handleChange('salonCogs', e.target.value)} />
                <span className={helpClass}>Color, supplies, backbar</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Total Salon Marketing</label>
                <CurrencyInput value={inputs.salonMarketing} onChange={(e) => handleChange('salonMarketing', e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hourly Rate</label>
                <CurrencyInput value={inputs.assistantHourly} onChange={(e) => handleChange('assistantHourly', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Hours/Day</label>
                <input type="number" className={inputClass} value={inputs.assistantHours} onChange={(e) => handleChange('assistantHours', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Days/Week</label>
                <input type="number" className={inputClass} value={inputs.assistantDays} onChange={(e) => handleChange('assistantDays', e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Assistant Tax %</label>
                <input type="number" className={inputClass} value={inputs.asstTaxPct} onChange={(e) => handleChange('asstTaxPct', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Credit Card Fee %</label>
                <input type="number" className={inputClass} value={inputs.ccFeePct} onChange={(e) => handleChange('ccFeePct', e.target.value)} />
              </div>
            </div>
          </div>

          {/* Results */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Current vs Renter Comparison</h3>

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Current Commission Take-Home</span>
              <span className="text-lg font-bold text-emerald-700">{formatCurrency(calculations.currentTakeHome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Total Renter COGS</span>
              <span className="text-lg font-bold text-red-700">{formatCurrency(calculations.totalCOGS)}</span>
            </div>

            <div className="bg-amber-50 border border-amber-200/60 rounded-lg p-4 mt-4">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Renter Take-Home (no client loss)</span>
                <span className="text-xl sm:text-2xl font-bold text-amber-700">{formatCurrency(calculations.scenarios[0].takeHome)}</span>
              </div>
            </div>

            {/* Scenarios */}
            <div className="mt-6">
              <h3 className="text-sm font-semibold text-stone-700 mb-3 pb-2 border-b-2 border-stone-100">Renter Scenarios (Client Retention)</h3>
              {calculations.scenarios.map(({ retention, takeHome }) => (
                <div key={retention} className="flex flex-wrap justify-between items-baseline gap-x-4 py-2.5 border-b border-stone-100 last:border-b-0">
                  <span className="text-sm text-stone-600">
                    {retention === 0 ? 'No clients stay with salon' : `${retention}% clients stay with salon`}
                  </span>
                  <span className={`text-base font-semibold ${takeHome > calculations.currentTakeHome ? 'text-emerald-700' : 'text-red-700'}`}>
                    {formatCurrency(takeHome)}
                  </span>
                </div>
              ))}
            </div>

            <div className="bg-emerald-50 border border-emerald-200/60 rounded-lg p-4 mt-5">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Break-Even Weekly Rent</span>
                <span className="text-xl sm:text-2xl font-bold text-emerald-700">{formatCurrency(calculations.maxRentWeekly)}/week</span>
              </div>
              <p className="text-xs text-stone-400 mt-2">Maximum rent you could pay to match current commission income</p>
            </div>
          </div>
        </div>
      );
    };

    // Renter to Commission Calculator
    const RenterToCommission = () => {
      const [inputs, setInputs] = usePersistedState('r2c-inputs', {
        serviceIncome: 201965,
        tips: 32099,
        weeklyRent: 525,
        otherExpenses: 15000,
        desiredCommission: 50,
        assistantHourly: 20,
        assistantHours: 6,
        assistantDays: 4,
        asstTaxPct: 7,
        salonCogs: 96413,
        salonMarketing: 33375,
        totalStylistHours: 16375.25,
        stylistHours: 1719.82,
        ccFeePct: 2.9,
      });

      const handleChange = (field, value) => {
        setInputs(prev => ({ ...prev, [field]: parseFloat(value) || 0 }));
      };

      const calculations = useMemo(() => calculateRenterToCommission(inputs), [inputs]);

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
          <div className="mb-8">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Current Renter Setup</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
              <div className="flex flex-col">
                <label className={labelClass}>Annual Service Income</label>
                <CurrencyInput value={inputs.serviceIncome} onChange={(e) => handleChange('serviceIncome', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Annual Tips</label>
                <CurrencyInput value={inputs.tips} onChange={(e) => handleChange('tips', e.target.value)} />
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Weekly Rent</label>
                <CurrencyInput value={inputs.weeklyRent} onChange={(e) => handleChange('weeklyRent', e.target.value)} />
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="flex flex-col">
                <label className={labelClass}>Other Expenses</label>
                <CurrencyInput value={inputs.otherExpenses} onChange={(e) => handleChange('otherExpenses', e.target.value)} />
                <span className={helpClass}>Insurance, supplies, etc.</span>
              </div>
              <div className="flex flex-col">
                <label className={labelClass}>Test Commission %</label>
                <input type="number" className={inputClass} value={inputs.desiredCommission} onChange={(e) => handleChange('desiredCommission', e.target.value)} />
                <span className={helpClass}>Compare this commission rate</span>
              </div>
            </div>
          </div>

          {/* Results */}
          <div className="bg-stone-50 rounded-xl p-5 md:p-6 border border-stone-200/60">
            <h3 className="text-sm font-semibold text-stone-700 mb-4 pb-2 border-b-2 border-stone-100">Commission Equivalent</h3>

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Current Renter Take-Home</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.currentTakeHome)}</span>
            </div>

            <div className="bg-orange-50 border border-orange-200/60 rounded-lg p-4 mt-4">
              <div className="flex flex-wrap justify-between items-baseline gap-x-4 gap-y-1">
                <span className="text-sm text-stone-600">Required Commission % to Match</span>
                <span className="text-xl sm:text-2xl font-bold text-orange-700">
                  {calculations.requiredCommission.toFixed(1)}%
                </span>
              </div>
            </div>

            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3 mt-3 border-b border-stone-200">
              <span className="text-sm text-stone-500">Income at {inputs.desiredCommission}% commission</span>
              <span className="text-lg font-bold text-stone-900">{formatCurrency(calculations.commissionIncome)}</span>
            </div>
            <div className="flex flex-wrap justify-between items-baseline gap-x-4 py-3">
              <span className="text-sm text-stone-500">Difference vs Current</span>
              <span className={`text-lg font-bold ${calculations.difference >= 0 ? 'text-emerald-700' : 'text-red-700'}`}>
                {calculations.difference >= 0 ? '+' : ''}{formatCurrency(calculations.difference)}
              </span>
            </div>
          </div>
        </div>
      );
    };

    const VALID_TABS = ['commission-to-renter', 'renter-to-commission'];
    const getTabFromHash = () => {
      const hash = window.location.hash.replace('#', '');
      return VALID_TABS.includes(hash) ? hash : 'commission-to-renter';
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState(getTabFromHash);

      // Sync hash -> tab on popstate (back/forward)
      useEffect(() => {
        const onHashChange = () => setActiveTab(getTabFromHash());
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      // Sync tab -> hash on click
      const switchTab = (tab) => {
        window.location.hash = tab;
        setActiveTab(tab);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 md:py-12">
          <div className="mb-8">
            <h1 className="text-2xl md:text-3xl font-bold text-stone-900 tracking-tight">Studio Metrics</h1>
            <p className="text-sm text-stone-500 mt-1">Commission vs Renter Analysis Tool</p>
          </div>

          <div className="flex gap-1 mb-6">
            <button
              className={`flex-1 sm:flex-none px-4 sm:px-5 py-3.5 rounded-t-xl text-sm font-semibold transition-all border-b-2 min-h-[44px] ${
                activeTab === 'commission-to-renter'
                  ? 'bg-white text-amber-700 border-amber-500 shadow-sm'
                  : 'bg-stone-100 text-stone-500 border-transparent hover:bg-stone-200 hover:text-stone-700 active:bg-stone-300'
              }`}
              onClick={() => switchTab('commission-to-renter')}
            >
              Commission &rarr; Renter
            </button>
            <button
              className={`flex-1 sm:flex-none px-4 sm:px-5 py-3.5 rounded-t-xl text-sm font-semibold transition-all border-b-2 min-h-[44px] ${
                activeTab === 'renter-to-commission'
                  ? 'bg-white text-amber-700 border-amber-500 shadow-sm'
                  : 'bg-stone-100 text-stone-500 border-transparent hover:bg-stone-200 hover:text-stone-700 active:bg-stone-300'
              }`}
              onClick={() => switchTab('renter-to-commission')}
            >
              Renter &rarr; Commission
            </button>
          </div>

          {activeTab === 'commission-to-renter' ? <CommissionToRenter /> : <RenterToCommission />}

          <p className="text-center text-xs text-stone-400 mt-8">Studio Los Gatos &middot; StudioMetrics</p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
